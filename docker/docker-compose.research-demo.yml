services:
  db:
    container_name: !reset null
    image: pgvector/pgvector:pg16
    environment: !override
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: !reset []
    volumes: !override
      - research-demo-db:/var/lib/postgresql/data
    command: !reset null

  redis:
    container_name: !reset null
    image: redis:7-alpine

  api:
    container_name: !reset null
    volumes:
      - type: bind
        source: ${RESEARCH_DEMO_UPLOAD_HOST_DIR:-../data/research-demo-uploads}
        target: /workspace/data/research-uploads
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"

  celery_worker:
    container_name: !reset null
    volumes:
      - type: bind
        source: ${RESEARCH_DEMO_UPLOAD_HOST_DIR:-../data/research-demo-uploads}
        target: /workspace/data/research-uploads
        read_only: true
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"

volumes:
  redis-data:
    name: !reset null
  research-demo-db:
